name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Check specifications
        shell: bash
        run: |
          python scripts/spec.py check
          if find specs/changes -mindepth 1 -maxdepth 2 -type d \
            | grep -Eq '/(00[3-9]|0[1-9][0-9]|[1-9][0-9]{2,})-'; then
            python scripts/spec.py check --strict
          elif ! python scripts/spec.py check --strict; then
            echo "::warning::Strict SDD validation becomes required at change 003."
          fi

      - name: Lint critical rules
        run: python -m ruff check --select E4,E7,E9,F corecoder tests scripts

      - name: Compile
        run: python -m compileall -q corecoder tests

      - name: Smoke CLI
        run: |
          python -m corecoder --help
          python -m corecoder run --help

      - name: Check whitespace
        run: git diff --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Compile
        run: python -m compileall -q corecoder tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*
